<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container my-4">
    <section id="calculator" class="p-3">
        <h2>Калькулятор стоимости заказа</h2>

        <form id="calculator-form">
            <label for="product">Выберите товар:</label><br>
            <select id="product" class="form-select w-auto d-inline-block">
                <option value="100">Тетрадь — 100 руб.</option>
                <option value="50">Ручка — 50 руб.</option>
                <option value="500">Книга — 500 руб.</option>
            </select>

            <br><br>

            <label for="quantity">Количество товара:</label><br>
            <input
                    type="text"
                    id="quantity"
                    class="form-control w-auto d-inline-block"
                    placeholder="Введите количество"
            >

            <br><br>

            <button type="submit" class="btn btn-primary">Рассчитать стоимость</button>
        </form>
        <br>
        <p id="message"></p>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
